# Updates of the dependencies, once a month, each ecosystem in one grouped pull request. Security updates come
# separately, as soon as there's an advisory (Dependabot alerts in the repository's settings).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /src
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ['*']
    ignore:
      # major versions by hand: a new major of a client library can change its API or drop a target framework, and a
      # new .NET version is a change of the target frameworks
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # the packages reference the lowest version for each target framework (8.0.0, 9.0.0, 10.0.0) on purpose, so an
      # application is not made to upgrade it
      - dependency-name: 'Microsoft.Extensions.Logging.Abstractions'
      # AWSSDK is 4.0 for net8.0 and net9.0 (4.1 needs System.IO.Hashing 11, which does not support them) and 4.1 for
      # net10.0: minor updates by hand, so the two lines stay apart
      - dependency-name: 'AWSSDK.*'
        update-types: ['version-update:semver-minor']

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    groups:
      website:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
