# NuGet: a pull request per package once a month, each evaluated by hand. A package reference of a library is the
# lowest version its users get, so it is raised only for a reason (an advisory, a fix or an API we need, a line out of
# support); a pull request without one is closed. Security updates come as soon as there's an advisory (Dependabot
# alerts and security updates in the repository's settings).
# No ignore rules: GitHub applies them to security updates too.
# Dependabot installs the SDK of global.json (it has none for .NET 11 otherwise, and cannot restore net11.0).
# The website and the GitHub Actions: version updates once a month, each ecosystem in one grouped pull request.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /src
    schedule:
      interval: monthly
    # not grouped, so each package can be taken or closed on its own
    open-pull-requests-limit: 20

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    groups:
      website:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
